<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livestream Reaction Engine</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Livestream Reaction Engine</h1>
      <p class="engine-badge" aria-live="polite">Engine: <strong id="engineLabel">Phase 1 · CSS Keyframes</strong></p>
    </header>

    <!-- Animation stage: reactions are appended here and float upwards -->
    <section class="stage" id="stage" aria-label="Livestream reaction stage">
      <div class="hud" aria-live="off">
        <span>Active <strong id="activeCount">0</strong></span>
        <span>GSAP timelines <strong id="timelineCount">0</strong></span>
        <span>Spawned <strong id="spawnedCount">0</strong></span>
        <span>Completed <strong id="completedCount">0</strong></span>
      </div>
    </section>

    <section class="controls" aria-label="Reaction controls">
      <fieldset class="group">
        <legend>Reaction</legend>
        <div class="choices" id="reactionChoices">
          <label><input type="radio" name="reaction" value="❤️" checked><span aria-label="Heart">❤️</span></label>
          <label><input type="radio" name="reaction" value="👍"><span aria-label="Like">👍</span></label>
          <label><input type="radio" name="reaction" value="🔥"><span aria-label="Fire">🔥</span></label>
          <label><input type="radio" name="reaction" value="⭐"><span aria-label="Star">⭐</span></label>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>Animation engine</legend>
        <div class="choices engines">
          <label><input type="radio" name="engine" value="css" checked><span>Phase 1: CSS Keyframes</span></label>
          <label><input type="radio" name="engine" value="gsap"><span>Phase 2: GSAP</span></label>
        </div>
        <p class="notice" id="engineNotice" role="status" hidden></p>
      </fieldset>

      <div class="group actions">
        <button type="button" class="btn primary" id="sendBtn">Send Reaction</button>
        <button type="button" class="btn" id="burstBtn">Spawn 50 Reactions</button>
        <button type="button" class="btn ghost" id="resetBtn">Reset</button>
      </div>

      <!-- Only meaningful for GSAP (timeScale), so it is hidden in Phase 1 -->
      <div class="group speed" id="speedGroup" hidden>
        <label for="speedSlider">Playback speed <output id="speedOutput" for="speedSlider">1.0x</output></label>
        <input type="range" id="speedSlider" min="0.1" max="2.0" step="0.1" value="1.0">
      </div>
    </section>
  </main>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/css-engine.js"></script>
  <script src="js/gsap-engine.js"></script>
  <script src="js/reaction-manager.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
